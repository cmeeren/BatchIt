name: CI

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0

      - name: Restore tools
        run: dotnet tool restore

      - name: Check code format
        run: dotnet fantomas --check .

      - name: Test release helper
        run: node --test .agents/skills/release-batchit/scripts/wait-for-nuget.test.js

      - name: Pack
        run: dotnet pack -c Release src/BatchIt/BatchIt.fsproj --output artifacts/packages


  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0

      - name: Test
        run: dotnet test -c Release


  publish:

    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v/')
    permissions:
      contents: read
      id-token: write

    needs:
      - lint
      - test

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0

      - name: Pack
        run: dotnet pack -c Release src/BatchIt/BatchIt.fsproj --output artifacts/packages

      - name: NuGet login
        uses: NuGet/login@v1.2.0
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes only the package matching the tag, and fails if NuGet already has that version, so a green run means this
      # run uploaded it.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          package="artifacts/packages/BatchIt.${GITHUB_REF_NAME#v/}.nupkg"
          if [ ! -f "$package" ]; then
            echo "::error::No package matches tag $GITHUB_REF_NAME. Packages built:" $(ls artifacts/packages)
            exit 1
          fi
          dotnet nuget push "$package" -s "https://api.nuget.org/v3/index.json" -k "$NUGET_API_KEY"
